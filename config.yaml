# 대상정보 증강 템플릿
target_augmentation_template : |
  너는 사용자의 질문을 읽고, 질문 속에 등장하는 사람(대상)의 정보를 명확하고 풍부하게 보완하는 역할을 맡았어.
  **원래 질문은 유지하고 괄호를 사용하여 추가 정보를 제시하는 방식을 선택해.**

  아래는 연령대별 대표 대상어 리스트야:

  영유아: 신생아, 영아, 유아, 아기, 미취학 아동  
  어린이: 초등학생, 아동, 어린이  
  청소년: 10대, 중학생, 고등학생, 청소년, 미성년자, 학령기  
  청년: 20대, 대학생, 취준생, 신입사원, 사회초년생, 청년, 젊은층, MZ세대  
  청장년: 30대, 중간관리자, 신혼부부, 기혼, 부모세대  
  장년: 40대, 중년, 장년층  
  중장년: 50대, 베이비부머, 은퇴 준비자, 중장년층  
  고령자: 노인, 은퇴자, 고령자, 시니어, 실버세대, 노년층  
  초고령자: 80세 이상 고령자, 초고령자, 장수 인구  

  아래 단계를 따라 질문을 정제해줘.

  ## 처리 순서 (Chain of Thought)  
  1. 질문 속 대상어를 모두 찾아. 대상어는 여러 개일 수 있어.  
  2. 대상어가 ‘직장인’ 또는 ‘근로자’에 해당하면, 대상어 뒤에 (직장인/근로자)라고 붙여.  
  3. 2번에 해당하지 않으면, 연령대별 대표 대상어 리스트에서 대상어가 명확하게 한 그룹에 속하면, 원래 문장에서 대상어는 유지하고 바로 뒤에 괄호를 붙여서 (연령대 그룹, 대표 대상어)라고 붙여.  
  4. 대상어가 여러 개일 때, 같은 연령대 그룹에 속하면 가장 먼저 나온 대상어 뒤에 괄호를 붙이고, 다른 그룹은 각각 따로 처리해.  
  5. 대상어가 모호하거나 명확히 하나로 매핑되지 않으면 괄호 없이 원래 질문 그대로 둬.  
  6. [정제된 질문]에서 괄호를 제거했을 때 [원래 질문]과 동일한지 확인해.

  **원래 질문 속 단어는 절대 수정하거나 삭제하지 말고 그대로 둬. 의미가 같더라도 다른 단어로 바꾸지 마.**

  ## 예시  
  [원래 질문]: 직장인과 30대의 소비 패턴 차이는?  
  [정제된 질문]: 직장인(직장인/근로자)과 30대(청장년, 30대)의 소비 패턴 차이는?

  [원래 질문]: 근로자와 고등학생의 스트레스 수준은?  
  [정제된 질문]: 근로자(직장인/근로자)와 고등학생(청소년, 10대)의 스트레스 수준은?

  [원래 질문]: 신입사원과 대학생의 스트레스 수준은?  
  [정제된 질문]: 신입사원(청년, 20대)과 대학생의 스트레스 수준은?

  ---

  ## 사용자 질문  
  [원래 질문]: {user_input}

  ## 출력  
  [정제된 질문]:



# 시간정보 정규 템플릿
time_normalization_template : |
  너는 사용자의 질문을 읽고, 질문 속에 등장하는 시간 표현(시점)을 찾아 아래 기준에 따라 분류하고, 각 시점별 표현 및 연도 처리 규칙에 따라 문장을 정제하는 역할을 맡았어.

  아래는 시간별 대표 표현 리스트입니다:

  과거 : 어제, 지난주, 지난달, 작년, 재작년, 이전에, 그때, 그 시절, 예전, 예전에, 옛날, 한때, 과거에, 하루 전, 일주일 전, 몇 년 전, 과거, 예전부터, 한참 전, 얼마 전, 그 당시, 예전 같았으면, 어린 시절에, 작년인가 재작년쯤, 몇 해 전, (2025년 이전 연도)
  현재: 지금, 현재, 오늘, 요즘, 요새, 방금, 막, 최근, 당장, 계속해서, 금일, 현시점, 현황, 올해, 금방, 요즘은, 지금도, 여전히, 지금 이 순간, 현재 기준으로, 요즘 같은 시기엔,  (2025년)
  미래: 내일, 모레, 내년, 글피, 다음주, 다음달, 다음해, 곧, 앞으로, 훗날, 조만간, 추후, 장래에, 향후, 차후, 미래, 장차, 예측컨대, 머지않아, 언젠가는, 몇 년 후쯤, 앞으로는, 나중에, 가까운 시일 내에, (2026년 이후 연도)
  아래 단계에 따라 질문을 정제해주세요.

  특수 변환 규칙(현재 연도는 2025년 기준):
  재작년 → 2023년
  작년 → 2024년
  지난 해 → 2024년
  삼년 전 → 2022년
  사년 전 → 2021년
  오년 전 → 2020년
  작년인가 → 2024년  
  재작년쯤 → 2023년

  ## 단계별 추론 
  1. 질문 속 시간 표현 또는 연도 정보를 모두 찾아
  2. 해당 표현 또는 연도가 과거/현재/ 미래 중 어느 시점에 해당하는 지 분류
  3. 시점별 정제 기준에 따라 표현 및 연도 유지 여부를 판단
  4. 표현 또는 연도를 생략하거나 유지하며,과거 표현 중 특수 변환 대상은 연도로 치환하고 과거 표현 중 일반 표현만 존재할 경우 "과거"라는 표현을 문장 앞에 자연스럽게 삽입
  5. 최종 출력에는 정제된 문장만 보여주고, 추론 과정은 포함하지 마.

  시점별 정제 기준은 아래와 같아.
  과거
  표현만 있는 경우: 특수 변환 규칙 대상이면 연도로 치환하고 해당하지 않으면 해당 표현 제거 후 문장 앞에 "과거"라는 표현을 자연스럽게 삽입
  연도만 있는 경우: 연도 유지
  표현과 연도 모두 있는 경우: 연도만 유지

  현재
  표현만 있는 경우: 표현 생략
  연도만 있는 경우: 연도 유지
  표현과 연도 모두 있는 경우: 연도만 유지

  미래
  표현만 있는 경우: "앞으로의"라는 표현을 자연스럽게 삽입
  연도만 있는 경우: 연도 유지
  표현과 연도 모두 있는 경우: 연도만 유지

  ## 예시 (6-shot)

  ### 예시 1
  원래 질문: 지난 해 청년들의 취업과 관련된 통계에 대해 알려줘
  #연도 키워드: 없음
  #시점: 과거
  [정제된 질문]: 2024년 청년들의 취업과 관련된 통계에 대해 알려줘

  ### 예시 2
  원래 질문: 지난 해 2024년 쌀소비와 관련된 통계가 있나요?
  #연도 키워드: 2024
  #시점: 과거
  [정제된 질문]: 2024년 쌀소비와 관련된 통계가 있나요?

  ### 예시 3
  원래 질문: 요즘 날씨 변화량에 대해 알려줘
  #연도 키워드: 없음
  #시점: 현재
  [정제된 질문]: 날씨 변화량에 대해 알려줘

  ### 예시 4
  원래 질문:  2025년 지금 프랜차이즈 매장수에 대한 통계가 있을까요?
  #연도 키워드: 2025
  #시점: 현재
  [정제된 질문]: 2025년 프랜차이즈 매장수에 대한 통계가 있을까요?

  ### 예시 5
  원래 질문: 향후 인구 변화량에 대해 알고 싶습니다.
  #연도 키워드: 없음
  #시점: 미래
  [정제된 질문]: 앞으로의 인구 변화량에 대해 알고 싶습니다.

  ### 예시 6
  원래 질문: 향후 2028년 소비자물가지수가 얼마나 변화될지 궁금합니다. 관련 통계가 있나요?
  #연도 키워드: 2028
  #시점: 미래
  [정제된 질문]: 2028년 소비자물가지수가 얼마나 변화될지 궁금합니다. 관련 통계가 있나요?

  ## 사용자 질문 및 출력
  [원래 질문]: {user_question}
  [정제된 질문]: {정제된 문장}  





# 지역통계 한정 통계분야 재분류 템플릿
survey_classification_template : |
  당신은 통계명을 읽고, 그것이 어떤 통계분야에 해당하는지 판단하는 전문가입니다.
  다음은 통계명을 분류해야 할 통계분야 목록입니다:

  통계분야 목록:
  '범죄·안전', '보건', '과학·기술', '국토이용', '문화.여가', '경제일반·경기', '복지',
  '정보통신', '소득·소비·자산', '에너지', '무역·국제수지', '수산', '농림', '사회일반', '금융',
  '인구', '교육·훈련', '기업경영', '노동', '건설', '교통·물류', '환경', '도소매·서비스',
  '정부·재정', '주거', '국민계정', '임금', '광업·제조업', '물가'

  다음에 제시된 통계명을 참고하여 문맥적으로 어떤 분야에 속하는지를 신중히 판단하고, 위 목록 중에서 가장 적절한 분야로 분류하세요.

  가능하다면 단어의 의미, 키워드, 사회적 맥락 등을 근거로 추론하고, **결과만 출력**하세요.

  ※ 반드시 통계분야 목록 중 **하나만 선택**하여 출력하세요.

  ---
  ## 입력
  [통계명]:  "{survey_name}"

  ## 출력
  [분류]: 




# 통계표명에서 분류기준을 추출하는 템플릿
criteria_extraction_template : |
  당신은 통계표명을 읽고, **명시적으로 표현된** 통계표의 **분류 기준**을 찾는 전문가입니다.
  
  아래의 조건에 따라 해당하는 것을 모두 수집하세요.

  ## 분류기준 추출 규칙
  1. 만약 문장에 "별", "에 따른", "에 의한" 등의 표현이 없거나, 분류기준이 명확하지 않다면 **기준없음을 출력**하세요.
  2. 인물이나 대상을 분류기준으로 판단하지 마세요.
  3. 각 기준은 반드시 **~별** 형태로 출력하세요.
  4. 분류기준이 여러개인 경우 쉼표로 구분하세요.
  5. 너무 상세한 기준을 제시하지 않도록 일반화합니다:
    - 산업세세분류별, 산업중분류별, 산업대분류별은 **산업별**로 대체
    - 시군별, 시도별은 **행정구역별**로 대체
    - 종류별, 유형별, 특성별의 경우 일반적이므로 적절한 명사를 앞에 추가하거나 생략
  
  ## 주의사항
  - **측정 대상이 뒤에 붙는 경우**, 이를 포함하지 말고 앞의 분류기준만 추출하세요.
  - 문맥적으로 유추하거나 추측하지 마세요. **확실히 쓰여 있지 않다면 절대 추출하지 마세요.**
  - **출력은 반드시 분류기준만 포함하며, 그 외 텍스트는 포함하지 마세요.**
  - **결과만 출력**하세요.

  ---
  ## 입력
  [통계표명]: "{table_name}"

  ## 출력




# 통계표명에서 대상을 추출하는 템플릿
target_extraction_template : |
  당신은 통계표명을 읽고, 통계의 **측정 대상**이 되는 주요 명사(지표)를 추출하는 전문가입니다.

  아래의 규칙에 따라 대상을 추출하세요:

  ## 추출 규칙
  1. 농가, 인구, 사업체수, 학생 수, 가구 등 **측정 대상이 되는 주요 명사를 중심으로 추출**하세요.
  2. "~별", "~에 따른", "~에 의한" 등 **분류 기준 표현은 모두 제외**하고, **그 뒤에 오는 명사만 추출**하세요.
  3. **분류 기준에 해당하는 단어(예: 연령, 산업, 지역 등)**가 들어간 명사는 **모두 제외**하세요.
    - 예: "연령별 인구" → "인구", "산업별 고용" → "고용"
  4. 여러 개의 대상이 있다면 쉼표로 구분하세요.
  5. 표현이 추상적이거나 기준 없이 막연한 경우는 빈칸으로 두세요.

  ## 주의사항
  - 문맥적으로 추론하지 말고, **명시적으로 표현된 대상만 추출**하세요.
  - 문장에서 **'무엇을 측정하고 있는지'를 나타내는 목적어**를 중심으로 추출하고, **수식어는 생략**하세요.
  - **분류기준 표현은 절대 포함하지 마세요.**
    - 단, **고유명사 수준의 복합 명사(예: 귀산촌가구)**이 대상 전체를 대표하는 경우는 생략하지 마세요.
  - **출력은 반드시 대상만 포함하며, 그 외 텍스트는 포함하지 마세요.**
  - **결과만 출력**하세요.

  ---
  ## 입력
  [통계표명]: "{table_name}"

  ## 출력

